name: Publish to MCP Registry

# OIDC rather than a token: the workflow proves it is running in a repository
# owned by CDVolvik, and the registry grants the io.github.CDVolvik/* namespace
# on that basis. No secret is stored, so there is nothing to leak or rotate.
#
# Owner changed 2026-08-05 (kushaim -> CDVolvik). Because OIDC derives the
# namespace from the repo owner, this workflow can now ONLY publish under
# io.github.CDVolvik/*. The existing io.github.kushaim/ftthelper-mcp listing
# (v1.0.0, published 2026-08-04) is therefore no longer updatable from here --
# running this would create a SECOND registry entry, not move the first one.
#
# There is no package step. This server is hosted, not installed — server.json
# declares a `remotes` entry and no `packages`, so publishing is metadata only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Publish nothing that fails its own checks. server.json is validated
      # against the registry schema here, which is cheaper to fix than a bad
      # public listing.
      - name: Validate before publishing
        run: |
          pip install --quiet jsonschema
          python scripts/check-docs.py

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
